name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets cannot be used in `if:` directly; expose only whether they are set.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: cp apps/api/.dev.vars.example apps/api/.dev.vars

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build # builds apps/web into apps/web/dist, which wrangler uploads as assets

      - name: Check deploy prerequisites
        id: gate
        run: |
          deploy=true
          if [ "$HAS_CF_TOKEN" != "true" ]; then
            echo "::notice::Skipping deploy: the CLOUDFLARE_API_TOKEN secret is not configured."
            deploy=false
          fi
          if [ "$HAS_CF_ACCOUNT_ID" != "true" ]; then
            echo "::notice::Skipping deploy: the CLOUDFLARE_ACCOUNT_ID variable is not configured."
            deploy=false
          fi
          if grep -q '00000000-0000-0000-0000-000000000000' apps/api/wrangler.jsonc; then
            echo "::notice::Skipping deploy: apps/api/wrangler.jsonc still has the placeholder D1 database_id."
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        if: env.HAS_CF_TOKEN == 'true' && steps.gate.outputs.deploy == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply password-manager --remote

      - name: Deploy Worker
        if: env.HAS_CF_TOKEN == 'true' && steps.gate.outputs.deploy == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
