name: CI

on:
  push:
    branches-ignore: [master] # master is checked by deploy.yml, which runs the same steps first
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Throwaway local values; the API tests read the same file as `wrangler dev`.
      - run: cp apps/api/.dev.vars.example apps/api/.dev.vars

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
