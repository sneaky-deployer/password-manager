name: E2E

# Playwright journeys against a real `wrangler dev` (local D1) serving the built SPA, driven in
# Chromium with two browser contexts (two users). See apps/web/e2e and PLAN.md section 17.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # Builds the SPA (apps/web/dist), then runs the suite. The suite starts its own isolated
      # wrangler dev with throwaway secrets, so no .dev.vars is needed.
      - name: Run end-to-end tests
        run: bun run test:e2e
        env:
          CI: "true"

      # The report holds screenshots and traces of the throwaway test accounts only.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
